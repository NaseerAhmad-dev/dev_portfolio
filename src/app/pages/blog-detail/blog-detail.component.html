<div class="dw" *ngIf="blog"><button class="bb" (click)="back()">← Back to articles</button><div class="dc" [ngClass]="blog.coverClass">{{blog.icon}}</div><div class="de"><span class="dcat">{{blog.category}}</span><span class="ddate">{{blog.date}}</span></div><h1 class="dt">{{blog.title}}</h1><div class="dm"><span class="ac">✦ {{blog.author}}</span><span class="rc">⏱ {{blog.readTime}}</span></div><div class="dtags"><span class="dtag" *ngFor="let t of blog.tags">{{t}}</span></div><div class="blog-body" [innerHTML]="blog.body"></div><div class="rs"><div class="rh">More articles</div><div class="rg"><div class="rc2" *ngFor="let r of related" (click)="open(r.id)"><div class="rcov" [ngClass]="r.coverClass">{{r.icon}}</div><div class="rb"><div class="rt">{{r.title}}</div><div class="rd">{{r.date}}</div></div></div></div></div></div><app-footer></app-footer>
