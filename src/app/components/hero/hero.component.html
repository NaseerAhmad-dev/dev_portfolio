<section class="hero" id="home" *ngIf="hero">

  <!-- ── top bar: kicker + line + status badge ── -->
  <div class="hero-top">
    <div class="hero-label">
      <span class="hero-kicker">00 — intro</span>
      <div class="hero-label-line"></div>
    </div>
    <span class="hero-status">
      <span class="hero-dot"></span>{{ availableText }}
    </span>
  </div>

  <!-- ── main copy ──────────────────────────────── -->
  <div class="hero-body">
    <span class="hero-greeting">{{ hero.titleLine1 }}</span>
    <h1 class="hero-name">{{ hero.titleLine2 }}</h1>
    <span class="hero-role">{{ hero.titleLine3 }}</span>
  </div>

  <p class="hero-sub">{{ hero.subtitle }}</p>

  <div class="hero-actions">
    <a class="btn-glow" href="#work">{{ hero.ctaPrimary }}</a>
    <a class="btn-glass" href="assets/data/Naseer_Ahmad_Deve.pdf" target="_blank" rel="noopener noreferrer">{{ hero.ctaSecondary }}</a>
  </div>

  <!-- ── stats grid (matches certs / skills card pattern) ── -->
  <div class="hero-stats">
    <div class="hero-stat" *ngFor="let s of hero.stats">
      <span class="hero-stat-val">{{ s.value }}</span>
      <span class="hero-stat-lbl">{{ s.label }}</span>
    </div>
  </div>

</section>
