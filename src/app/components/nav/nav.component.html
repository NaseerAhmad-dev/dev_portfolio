<nav [class.menu-open]="menuOpen">

  <!-- left: logo -->
  <a class="logo-wrap" routerLink="/" (click)="closeMenu()">
    <div class="logo-mark">N</div>
    <div class="logo-text">
      <span class="logo-name">Naseer</span>
      <span class="logo-role">Software Engineer</span>
    </div>
  </a>

  <!-- center: nav links -->
  <div class="nav-links" [class.open]="menuOpen">
    <a *ngFor="let l of navLinks" (click)="scrollTo(l.href)" style="cursor:pointer">{{ l.label }}</a>
    <a routerLink="/blog" routerLinkActive="active" class="nav-blog-pill" (click)="closeMenu()">Blog</a>
  </div>

  <!-- right: theme toggle + hamburger -->
  <div class="nav-end">
    <button
      class="theme-toggle"
      (click)="theme.toggle()"
      [title]="theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-label]="theme.isDark ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="theme.isDark" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg *ngIf="!theme.isDark" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
    </button>

    <button
      class="hamburger"
      [class.open]="menuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

</nav>

<div class="nav-backdrop" [class.visible]="menuOpen" (click)="closeMenu()"></div>
